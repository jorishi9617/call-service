server.port=8081
spring.application.name=call-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:video_platform}}
spring.datasource.username=${DATABASE_USER:video}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=calls
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=calls
spring.flyway.default-schema=calls
security.jwt.secret=${JWT_SECRET:bG9jYWwtZGV2LXNlY3JldC1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZA==}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info
