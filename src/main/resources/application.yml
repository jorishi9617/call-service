server:
  port: ${PORT:${SERVER_PORT:8082}}
spring:
  application:
    name: call-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    schemas: calls
    default-schema: calls
security:
  jwt:
    secret: ${JWT_SECRET}
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS}
management:
  endpoints:
    web:
      exposure:
        include: health,info
